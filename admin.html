<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin — Fraternité 112</title>

<style>
:root {
    --bg: #080b12;
    --panel: #111722;
    --panel2: #151c29;
    --border: #263044;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #e63946;
    --primary-hover: #ff4d5a;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top right, rgba(230,57,70,.12), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 250px;
    height: 100vh;
    padding: 24px 16px;
    background: rgba(10,14,22,.94);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(20px);
    z-index: 20;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    margin-bottom: 35px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--primary);
    font-size: 21px;
}

.logo strong {
    display: block;
}

.logo span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
}

.nav-title {
    color: #64748b;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 0 12px;
    margin-bottom: 8px;
}

.nav-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: #cbd5e1;
    text-align: left;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 5px;
    transition: .2s;
}

.nav-item:hover,
.nav-item.active {
    background: rgba(230,57,70,.12);
    color: white;
}

/* MAIN */

.main {
    margin-left: 250px;
    padding: 30px;
    max-width: 1400px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.topbar h1 {
    margin: 0;
    font-size: 30px;
}

.topbar p {
    color: var(--muted);
    margin: 7px 0 0;
}

.status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    color: #cbd5e1;
    font-size: 13px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--warning);
}

.dot.online {
    background: var(--success);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 390px;
    gap: 20px;
}

.card {
    background: rgba(17,23,34,.9);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.card-header h2 {
    margin: 0;
    font-size: 19px;
}

/* FORM */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    color: #cbd5e1;
    font-weight: 600;
}

input,
textarea,
select {
    width: 100%;
    background: #0c111b;
    border: 1px solid var(--border);
    color: white;
    border-radius: 10px;
    padding: 12px 13px;
    outline: none;
    transition: .2s;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(230,57,70,.12);
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

/* BUTTONS */

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 700;
    transition: .2s;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

.btn-secondary {
    background: #202a3b;
    color: white;
}

.btn-secondary:hover {
    background: #2a3549;
}

.btn-danger {
    background: rgba(239,68,68,.12);
    color: #f87171;
}

.btn-danger:hover {
    background: rgba(239,68,68,.2);
}

.btn-small {
    padding: 8px 11px;
    font-size: 12px;
}

/* ARTICLES */

.article-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.article {
    display: flex;
    gap: 15px;
    padding: 15px;
    border: 1px solid var(--border);
    background: var(--panel2);
    border-radius: 14px;
}

.article-image {
    width: 110px;
    height: 80px;
    object-fit: cover;
    border-radius: 10px;
    background: #0a0f18;
    flex-shrink: 0;
}

.article-content {
    flex: 1;
    min-width: 0;
}

.article-title {
    font-weight: 750;
    margin-bottom: 5px;
    word-break: break-word;
}

.article-description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.article-meta {
    margin-top: 9px;
    color: #64748b;
    font-size: 11px;
}

.article-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

/* PREVIEW */

.preview {
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #0b1018;
}

.preview-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #101827;
}

.preview-body {
    padding: 17px;
}

.preview-category {
    display: inline-block;
    color: #fca5a5;
    background: rgba(230,57,70,.12);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    margin-bottom: 10px;
}

.preview-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
}

.preview-description {
    color: var(--muted);
    line-height: 1.55;
    font-size: 14px;
}

/* STATUS */

#status {
    display: none;
    margin-bottom: 20px;
    padding: 13px 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 14px;
}

#status.show {
    display: block;
}

#status.success {
    color: #86efac;
    background: rgba(34,197,94,.08);
    border-color: rgba(34,197,94,.2);
}

#status.error {
    color: #fca5a5;
    background: rgba(239,68,68,.08);
    border-color: rgba(239,68,68,.2);
}

#status.loading {
    color: #fde68a;
    background: rgba(245,158,11,.08);
    border-color: rgba(245,158,11,.2);
}

.empty {
    text-align: center;
    padding: 35px 15px;
    color: var(--muted);
}

/* MOBILE */

@media (max-width: 1000px) {

    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
    }

    .logo {
        margin-bottom: 15px;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 650px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .article {
        flex-direction: column;
    }

    .article-image {
        width: 100%;
        height: 150px;
    }

    .article-actions {
        margin-top: 10px;
    }
}
</style>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const GITHUB_USER = "spideyaxel";
const GITHUB_REPO = "112";
const GITHUB_BRANCH = "main";
const FILE_PATH = "actualites.json";

/*
   COLLE TON NOUVEAU TOKEN ICI.

   IMPORTANT :
   - Token avec permission Contents: Read and write
   - Repository access : uniquement spideyaxel/112
*/

const GITHUB_TOKEN = "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";


/* =========================================================
   ELEMENTS
========================================================= */

const titleInput =
    document.getElementById("title");

const descriptionInput =
    document.getElementById("description");

const imageInput =
    document.getElementById("image");

const categoryInput =
    document.getElementById("category");

const dateInput =
    document.getElementById("date");

const editIdInput =
    document.getElementById("editId");

const articleList =
    document.getElementById("articleList");

const statusBox =
    document.getElementById("status");


/* =========================================================
   INITIALISATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    dateInput.value =
        getToday();

    updatePreview();

    loadArticles();

});


/* =========================================================
   GITHUB API
========================================================= */

async function getGitHubFile() {

    if (
        !GITHUB_TOKEN ||
        GITHUB_TOKEN === "COLLE_TON_NOUVEAU_TOKEN_ICI"
    ) {
        throw new Error(
            "Token GitHub manquant dans admin.html."
        );
    }


    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/${GITHUB_REPO}/contents/` +
        `${FILE_PATH}?ref=${GITHUB_BRANCH}`;


    const response =
        await fetch(url, {

            method: "GET",

            headers: {

                "Authorization":
                    `Bearer ${GITHUB_TOKEN}`,

                "Accept":
                    "application/vnd.github+json",

                "X-GitHub-Api-Version":
                    "2022-11-28"

            }

        });


    let result;

    try {

        result =
            await response.json();

    } catch {

        result = {};

    }


    console.log(
        "GitHub GET",
        response.status,
        result
    );


    if (!response.ok) {

        let message =
            result.message ||
            "Erreur GitHub inconnue.";

        if (response.status === 401) {
            message =
                "Token GitHub invalide ou expiré.";
        }

        if (response.status === 403) {
            message =
                "Accès refusé. Vérifie Contents → Read and write.";
        }

        if (response.status === 404) {
            message =
                "actualites.json introuvable ou repository inaccessible.";
        }

        throw new Error(
            `GitHub ${response.status} — ${message}`
        );
    }


    return result;
}


/* =========================================================
   DECODAGE UTF-8
========================================================= */

function decodeBase64UTF8(base64) {

    const binary =
        atob(
            base64.replace(/\s/g, "")
        );

    const bytes =
        Uint8Array.from(
            binary,
            char => char.charCodeAt(0)
        );

    return new TextDecoder("utf-8")
        .decode(bytes);
}


/* =========================================================
   ENCODAGE UTF-8
========================================================= */

function encodeBase64UTF8(text) {

    const bytes =
        new TextEncoder()
            .encode(text);

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        binary += String.fromCharCode(
            ...bytes.subarray(
                i,
                i + chunkSize
            )
        );

    }

    return btoa(binary);
}


/* =========================================================
   CHARGER JSON
========================================================= */

async function loadArticles() {

    try {

        showStatus(
            "⏳ Connexion à GitHub...",
            "loading"
        );


        const file =
            await getGitHubFile();


        const jsonText =
            decodeBase64UTF8(
                file.content
            );


        const data =
            JSON.parse(jsonText);


        if (
            !data ||
            typeof data !== "object"
        ) {

            throw new Error(
                "Le JSON n'est pas valide."
            );

        }


        if (
            !Array.isArray(
                data.articles
            )
        ) {

            data.articles = [];

        }


        window.currentData = data;

        window.currentSha =
            file.sha;


        renderArticles(
            data.articles
        );


        updateStats(
            data.articles
        );


        setConnection(
            true
        );


        hideStatus();


    } catch (error) {

        console.error(
            "Erreur loadArticles:",
            error
        );


        setConnection(
            false
        );


        showStatus(
            "❌ " + error.message,
            "error"
        );


        articleList.innerHTML = `
            <div class="empty">
                Impossible de charger les actualités.<br><br>
                <small>
                    ${escapeHTML(error.message)}
                </small>
            </div>
        `;

    }

}


/* =========================================================
   SAUVEGARDER SUR GITHUB
========================================================= */

async function updateGitHubFile(
    data,
    sha,
    commitMessage
) {

    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const encoded =
        encodeBase64UTF8(
            json
        );


    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/${GITHUB_REPO}/contents/` +
        `${FILE_PATH}`;


    const response =
        await fetch(url, {

            method: "PUT",

            headers: {

                "Authorization":
                    `Bearer ${GITHUB_TOKEN}`,

                "Accept":
                    "application/vnd.github+json",

                "Content-Type":
                    "application/json",

                "X-GitHub-Api-Version":
                    "2022-11-28"

            },

            body:
                JSON.stringify({

                    message:
                        commitMessage,

                    content:
                        encoded,

                    sha:
                        sha,

                    branch:
                        GITHUB_BRANCH

                })

        });


    let result;

    try {

        result =
            await response.json();

    } catch {

        result = {};

    }


    console.log(
        "GitHub PUT",
        response.status,
        result
    );


    if (!response.ok) {

        throw new Error(
            `GitHub ${response.status} — ` +
            `${result.message || "Impossible de modifier le fichier."}`
        );

    }


    return result;
}


/* =========================================================
   AJOUT / MODIFICATION
========================================================= */

async function saveArticle() {

    const title =
        titleInput.value.trim();

    const description =
        descriptionInput.value.trim();

    const image =
        imageInput.value.trim();

    const category =
        categoryInput.value;

    const date =
        dateInput.value ||
        getToday();

    const editId =
        editIdInput.value;


    if (!title) {

        showStatus(
            "❌ Le titre est obligatoire.",
            "error"
        );

        titleInput.focus();

        return;
    }


    if (!description) {

        showStatus(
            "❌ La description est obligatoire.",
            "error"
        );

        descriptionInput.focus();

        return;
    }


    try {

        setSaving(
            true
        );


        showStatus(
            "⏳ Enregistrement sur GitHub...",
            "loading"
        );


        /*
           On recharge toujours le fichier avant
           de l'écrire afin d'avoir le SHA actuel.
        */

        const file =
            await getGitHubFile();


        const jsonText =
            decodeBase64UTF8(
                file.content
            );


        const data =
            JSON.parse(
                jsonText
            );


        if (
            !Array.isArray(
                data.articles
            )
        ) {

            data.articles = [];

        }


        if (editId) {

            /* MODIFICATION */

            const index =
                data.articles.findIndex(
                    article =>
                        String(article.id) ===
                        String(editId)
                );


            if (index === -1) {

                throw new Error(
                    "Cette actualité n'existe plus."
                );

            }


            const oldArticle =
                data.articles[index];


            data.articles[index] = {

                ...oldArticle,

                title,

                description,

                image,

                category,

                date

            };


            await updateGitHubFile(

                data,

                file.sha,

                `Modification actualité : ${title}`

            );


            showStatus(
                "✅ Actualité modifiée avec succès.",
                "success"
            );

        } else {

            /* AJOUT */

            const article = {

                id:
                    Date.now(),

                title,

                description,

                image,

                category,

                date

            };


            data.articles.unshift(
                article
            );


            await updateGitHubFile(

                data,

                file.sha,

                `Ajout actualité : ${title}`

            );


            showStatus(
                "✅ Actualité publiée avec succès.",
                "success"
            );

        }


        resetForm();

        await loadArticles();


    } catch (error) {

        console.error(
            "Erreur sauvegarde:",
            error
        );


        showStatus(
            "❌ " + error.message,
            "error"
        );

    } finally {

        setSaving(
            false
        );

    }

}


/* =========================================================
   SUPPRIMER
========================================================= */

async function deleteArticle(id) {

    const confirmed =
        confirm(
            "Voulez-vous vraiment supprimer cette actualité ?"
        );


    if (!confirmed) {
        return;
    }


    try {

        showStatus(
            "⏳ Suppression...",
            "loading"
        );


        const file =
            await getGitHubFile();


        const data =
            JSON.parse(
                decodeBase64UTF8(
                    file.content
                )
            );


        if (
            !Array.isArray(
                data.articles
            )
        ) {

            data.articles = [];

        }


        const article =
            data.articles.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        data.articles =
            data.articles.filter(
                item =>
                    String(item.id) !==
                    String(id)
            );


        if (!article) {

            throw new Error(
                "Actualité introuvable."
            );

        }


        await updateGitHubFile(

            data,

            file.sha,

            `Suppression actualité : ${article.title}`

        );


        showStatus(
            "✅ Actualité supprimée.",
            "success"
        );


        await loadArticles();


    } catch (error) {

        console.error(
            error
        );


        showStatus(
            "❌ " + error.message,
            "error"
        );

    }

}


/* =========================================================
   MODIFIER
========================================================= */

function editArticle(id) {

    const articles =
        window.currentData?.articles || [];


    const article =
        articles.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!article) {

        showStatus(
            "❌ Actualité introuvable.",
            "error"
        );

        return;
    }


    editIdInput.value =
        article.id;

    titleInput.value =
        article.title || "";

    descriptionInput.value =
        article.description || "";

    imageInput.value =
        article.image || "";

    categoryInput.value =
        article.category ||
        "Actualité";

    dateInput.value =
        article.date ||
        getToday();


    document.getElementById(
        "formTitle"
    ).textContent =
        "Modifier l'actualité";


    document.getElementById(
        "saveButton"
    ).textContent =
        "💾 Enregistrer";


    updatePreview();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   AFFICHER LES ARTICLES
========================================================= */

function renderArticles(
    articles
) {

    if (
        !articles ||
        articles.length === 0
    ) {

        articleList.innerHTML = `
            <div class="empty">
                📰<br><br>
                Aucune actualité pour le moment.
            </div>
        `;

        return;
    }


    articleList.innerHTML =
        articles.map(
            article => {

                const image =
                    article.image
                    ? `
                        <img
                            class="article-image"
                            src="${escapeAttribute(article.image)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >
                      `
                    : `
                        <div
                            class="article-image"
                            style="
                                display:grid;
                                place-items:center;
                                font-size:28px;
                            "
                        >
                            📰
                        </div>
                      `;


                return `

                    <div class="article">

                        ${image}

                        <div class="article-content">

                            <div class="article-title">
                                ${escapeHTML(
                                    article.title ||
                                    "Sans titre"
                                )}
                            </div>

                            <div class="article-description">
                                ${escapeHTML(
                                    article.description ||
                                    ""
                                )}
                            </div>

                            <div class="article-meta">

                                ${escapeHTML(
                                    article.category ||
                                    "Actualité"
                                )}

                                ·

                                ${escapeHTML(
                                    article.date ||
                                    ""
                                )}

                            </div>

                        </div>

                        <div class="article-actions">

                            <button
                                class="btn btn-secondary btn-small"
                                onclick="editArticle('${escapeAttribute(article.id)}')"
                            >
                                ✏️
                            </button>

                            <button
                                class="btn btn-danger btn-small"
                                onclick="deleteArticle('${escapeAttribute(article.id)}')"
                            >
                                🗑️
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================================
   PREVIEW
========================================================= */

function updatePreview() {

    const title =
        titleInput.value.trim() ||
        "Votre titre";


    const description =
        descriptionInput.value.trim() ||
        "Votre description apparaîtra ici.";


    const category =
        categoryInput.value;


    const image =
        imageInput.value.trim();


    document.getElementById(
        "previewTitle"
    ).textContent =
        title;


    document.getElementById(
        "previewDescription"
    ).textContent =
        description;


    document.getElementById(
        "previewCategory"
    ).textContent =
        category;


    const previewImage =
        document.getElementById(
            "previewImage"
        );


    if (image) {

        previewImage.src =
            image;

        previewImage.style.display =
            "block";

    } else {

        previewImage.style.display =
            "none";

    }

}


/* =========================================================
   EVENTS PREVIEW
========================================================= */

[
    titleInput,
    descriptionInput,
    imageInput,
    categoryInput
].forEach(
    element => {

        element.addEventListener(
            "input",
            updatePreview
        );

        element.addEventListener(
            "change",
            updatePreview
        );

    }
);


/* =========================================================
   RESET
========================================================= */

function resetForm() {

    editIdInput.value =
        "";

    titleInput.value =
        "";

    descriptionInput.value =
        "";

    imageInput.value =
        "";

    categoryInput.value =
        "Actualité";

    dateInput.value =
        getToday();


    document.getElementById(
        "formTitle"
    ).textContent =
        "Nouvelle actualité";


    document.getElementById(
        "saveButton"
    ).textContent =
        "🚀 Publier";


    updatePreview();

}


/* =========================================================
   UTILITAIRES
========================================================= */

function getToday() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type
) {

    statusBox.textContent =
        message;

    statusBox.className =
        `show ${type}`;

}


function hideStatus() {

    statusBox.className =
        "";

}


function setConnection(
    online
) {

    const dot =
        document.getElementById(
            "connectionDot"
        );

    const text =
        document.getElementById(
            "connectionText"
        );


    if (online) {

        dot.classList.add(
            "online"
        );

        text.textContent =
            "GitHub connecté";

    } else {

        dot.classList.remove(
            "online"
        );

        text.textContent =
            "Erreur GitHub";

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(
    articles
) {

    document.getElementById(
        "statArticles"
    ).textContent =
        articles.length;

}


/* =========================================================
   BOUTON SAUVEGARDE
========================================================= */

function setSaving(
    saving
) {

    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        saving;


    button.style.opacity =
        saving ? ".6" : "1";


    if (saving) {

        button.textContent =
            "⏳ Enregistrement...";

    } else if (
        editIdInput.value
    ) {

        button.textContent =
            "💾 Enregistrer";

    } else {

        button.textContent =
            "🚀 Publier";

    }

}

</script>
